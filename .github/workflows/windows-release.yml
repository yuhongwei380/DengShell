name: Windows release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)publish
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure NSIS
        shell: pwsh
        run: |
          $dir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "$dir\makensis.exe")) { choco install nsis -y --no-progress }
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:Path += ";$dir"
          }
          (Get-Command makensis).Source
      - name: Build desktop binary
        run: go build -buildvcs=false -trimpath -tags desktop,production -ldflags "-s -w -H windowsgui" -o build/out/DengShell.exe .
      - name: Prepare Windows image
        run: go run ./cmd/prepare-windows-image -in build/out/DengShell.exe -out build/out/DengShell-prepared.exe
      - name: Stage distribution
        run: python scripts/stage-windows.py --binary build/out/DengShell-prepared.exe --stage build/out/stage
      - name: Build installer
        run: python scripts/package-windows.py --stage build/out/stage --output build/out/DengShell-Setup-x64.exe
      - name: Build portable zip
        run: python -c "import importlib.util; from pathlib import Path; s=importlib.util.spec_from_file_location('pr','scripts/package-release.py'); pr=importlib.util.module_from_spec(s); s.loader.exec_module(pr); pr.zip_tree(Path('build/out/stage'), Path('build/out/DengShell-windows-x64.zip'))"
      - name: Build update artifacts
        run: python scripts/make-windows-update.py --binary build/out/DengShell-prepared.exe --output-dir build/out/update
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = (Select-String -Path internal/app/updates.go -Pattern 'const ApplicationVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $notes = "build/RELEASE-$version.md"
          if (gh release view $tag 2>$null) {
            gh release edit $tag --title "DengShell $tag" --notes-file $notes
          } else {
            gh release create $tag --title "DengShell $tag" --notes-file $notes
          }
          gh release upload $tag build/out/DengShell-Setup-x64.exe build/out/DengShell-windows-x64.zip build/out/update/up.exe build/out/update/up.exe.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
